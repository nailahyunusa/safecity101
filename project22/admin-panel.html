<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Crime Reports</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }
    header {
      background-color: #343a40;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    nav {
      background-color: #495057;
      padding: 1rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    #map {
      height: 400px;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 2rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .report-table {
      width: 100%;
      max-width: 1000px;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    .report-table th, .report-table td {
      border: 1px solid #ddd;
      padding: 0.8rem;
      text-align: left;
    }
    .report-table th {
      background-color: #343a40;
      color: #fff;
    }
    .report-table tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .action-btn {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      color: #fff;
    }
    .edit-btn { background-color: #007bff; }
    .delete-btn { background-color: #dc3545; }
  </style>
</head>
<body>

<header>
  <h1>Admin Dashboard - Crime Reports</h1>
</header>

<nav>
  <a href="#">Dashboard</a>
  <a href="#">Add Report</a>
  <a href="#">Users</a>
  <a href="#">Settings</a>
  <a href="#">Logout</a>
</nav>

<main>
  <div id="map"></div>

  <table class="report-table" id="reportTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Type</th>
        <th>Description</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Reports will be dynamically inserted here -->
    </tbody>
  </table>
</main>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // 1️⃣ Initialize the map
  const map = L.map('map').setView([9.0578, 7.4951], 13); // Default center

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 2️⃣ Manual list of crime reports
  const reports = [
    { id: 1, type: 'Theft', description: 'Stolen phone', lat: 9.0578, lng: 7.4951 },
    { id: 2, type: 'Assault', description: 'Physical attack reported', lat: 9.0600, lng: 7.5000 },
    { id: 3, type: 'Robbery', description: 'Bank robbery', lat: 9.0650, lng: 7.5100 }
  ];

  // 3️⃣ Add markers to map
  const markerGroup = L.featureGroup(); // To auto-fit map later

  reports.forEach(report => {
    const marker = L.marker([report.lat, report.lng])
      .addTo(map)
      .bindPopup(`<b>${report.type}</b><br>${report.description}`);
    
    markerGroup.addLayer(marker); // Add marker to group for bounds
  });

  map.fitBounds(markerGroup.getBounds()); // Zoom map to include all markers

  // 4️⃣ Populate table
  const reportTableBody = document.querySelector('#reportTable tbody');

  reports.forEach(report => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${report.id}</td>
      <td>${report.type}</td>
      <td>${report.description}</td>
      <td>(${report.lat.toFixed(4)}, ${report.lng.toFixed(4)})</td>
      <td>
        <button class="action-btn edit-btn">Edit</button>
        <button class="action-btn delete-btn">Delete</button>
      </td>
    `;
    reportTableBody.appendChild(tr);
  });
</script>

</body>
</html>
